# Object Detection Training & Inference - complete local stack
#   docker compose up -d        (see README.md; GPU: docker-compose.gpu.yml via COMPOSE_FILE in .env)
name: object-detection

x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-od}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-object_detection}

x-s3-env: &s3-env
  S3_ENDPOINT_URL: http://garage:3900
  S3_REGION: garage
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  S3_BUCKET_IMAGES: ${S3_BUCKET_IMAGES:-training-images}
  S3_BUCKET_DATASETS: ${S3_BUCKET_DATASETS:-datasets}
  S3_BUCKET_MODELS: ${S3_BUCKET_MODELS:-models}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-od}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-object_detection}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # 7.2 = last BSD-licensed Redis release (7.4+ is RSALv2/SSPLv1)
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./infrastructure/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  garage-init:
    build:
      context: ./infrastructure/garage
    restart: "no"
    environment:
      <<: *s3-env
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES:-100000000000}
    depends_on:
      garage:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: object-detection/api:latest
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env]
      REDIS_URL: redis://redis:6379/0
      TRAINING_QUEUE: training
      MODEL_CACHE_DIR: /var/cache/od-models
      OPENVINO_DEVICE: CPU
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      # cache of downloaded/compiled OpenVINO models (source of truth stays in S3)
      - model-cache:/var/cache/od-models
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    image: object-detection/trainer:latest
    restart: unless-stopped
    environment:
      <<: [*db-env, *s3-env]
      REDIS_URL: redis://redis:6379/0
      TRAINING_QUEUE: training
      TRAINER_WORK_DIR: /tmp/od-work
      BOOTSTRAP_ON_START: ${BOOTSTRAP_ON_START:-true}
      BASE_CHECKPOINT_URL: ${BASE_CHECKPOINT_URL:-https://download.openmmlab.com/mmdetection/v3.0/rtmdet/rtmdet_s_8xb32-300e_coco/rtmdet_s_8xb32-300e_coco_20220905_161602-387a891e.pth}
      BASE_CHECKPOINT_SHA256_PREFIX: ${BASE_CHECKPOINT_SHA256_PREFIX:-387a891e}
    # dataloader workers need shared memory
    shm_size: ${TRAINER_SHM_SIZE:-8gb}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: ./frontend
    image: object-detection/frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
  model-cache:
