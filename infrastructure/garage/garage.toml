# Single-node Garage for local use.
# Secrets are NOT stored here: rpc_secret and admin_token are provided via the
# environment variables GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN (docker-compose.yml).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
