[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "od-inference-server"
version = "0.1.0"
description = "Standalone detection API for production: one active OpenVINO model, replaced via an authenticated upload"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "openvino==2024.6.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
